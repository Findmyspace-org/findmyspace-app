<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FindMySpace Icon Set</title>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  padding: 32px;
  background: #f8fafc;
  color: #0c1d2f;
}
h1 { margin: 0 0 8px; }
p { margin: 0 0 24px; color: #475569; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
img { width: 96px; height: 96px; }
.label { font-weight: 700; margin-top: 10px; }
.file { color: #64748b; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<h1>FindMySpace icon set</h1>
<p>Brand-style SVG icons in navy and accent coral for space categories.</p>
<div class="grid">

    <div class="card">
      <img src="parking.svg" alt="Parking" />
      <div class="label">Parking</div>
      <div class="file">parking.svg</div>
    </div>
    
    <div class="card">
      <img src="storage.svg" alt="Storage" />
      <div class="label">Storage</div>
      <div class="file">storage.svg</div>
    </div>
    
    <div class="card">
      <img src="office.svg" alt="Office" />
      <div class="label">Office</div>
      <div class="file">office.svg</div>
    </div>
    
    <div class="card">
      <img src="garage.svg" alt="Garage" />
      <div class="label">Garage</div>
      <div class="file">garage.svg</div>
    </div>
    
    <div class="card">
      <img src="workspace.svg" alt="Workspace" />
      <div class="label">Workspace</div>
      <div class="file">workspace.svg</div>
    </div>
    
    <div class="card">
      <img src="other.svg" alt="Other" />
      <div class="label">Other</div>
      <div class="file">other.svg</div>
    </div>
    
</div>
</body>
</html>
